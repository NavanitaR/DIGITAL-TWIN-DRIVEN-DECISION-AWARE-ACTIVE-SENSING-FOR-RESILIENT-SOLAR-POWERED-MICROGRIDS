<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#142932}.net{stroke:#177052;stroke-width:2;fill:none}.symbol{stroke:#182f39;stroke-width:2;fill:#fafcff}</style><text x="30" y="35" font-size="22">02 / Panel electronic isolation channel with independent protection</text><text x="30" y="60" font-size="12" style="fill:#a34731">PROVISIONAL ENGINEERING REVIEW / Not assembly approval / 2026-11-09</text><text x="40" y="125" font-size="15">PVn+</text><polyline class="net" points="90,120 135,120"/><polyline class="net" points="135,120 150,120"/><rect class="symbol" x="150" y="112" width="55" height="16"/><polyline class="net" points="205,120 220,120"/><text x="146" y="100" font-size="11">FPn / DC fuse</text><polyline class="net" points="220,120 260,120"/><polyline class="net" points="260,120 275,120"/><rect class="symbol" x="275" y="112" width="55" height="16"/><polyline class="net" points="330,120 345,120"/><text x="271" y="100" font-size="11">Rsh=20mR / 1W</text><polyline class="net" points="345,120 440,120"/><rect class="symbol" x="440" y="90" width="300" height="220"/><text x="450" y="115" font-size="14">TPS25940L RVC20</text><text x="450" y="136" font-size="10">IN pins9-13 / OUT pins4-8</text><polyline class="net" points="740,120 1080,120"/><text x="900" y="105" font-size="14">CLUSTER_n+</text><text x="465" y="175" font-size="12">Internal opposing MOSFET protection</text><text x="465" y="197" font-size="12">Reverse blocking + current limiter</text><text x="465" y="225" font-size="12">EN14 / FLT20 / ILIM17 / dVdT18</text><text x="465" y="249" font-size="12">GND16 + exposed thermal pad</text><text x="465" y="275" font-size="12">DEVSLP1=GND; OVP15 divider</text><polyline class="net" points="260,120 260,185 160,185"/><polyline class="net" points="345,120 345,210 160,210"/><rect class="symbol" x="35" y="170" width="125" height="65"/><text x="45" y="195" font-size="14">INA226</text><text x="45" y="216" font-size="10">Kelvin IN+/IN-</text><polyline class="net" points="100,235 100,325"/><text x="40" y="350" font-size="12">I2C +3.3V logic</text><polyline class="net" points="510,310 510,365"/><polyline class="net" points="495,365 510,365"/><rect class="symbol" x="510" y="357" width="55" height="16"/><polyline class="net" points="565,365 580,365"/><text x="506" y="345" font-size="11">R_ILIM 75k target</text><polyline class="net" points="580,365 610,365"/><polyline class="net" points="610,365 610,380"/><polyline class="net" points="595,380 625,380"/><polyline class="net" points="600,386 620,386"/><polyline class="net" points="605,392 615,392"/><text x="450" y="420" font-size="12">89/R(kohm) gives nominal 1.19A; audit tolerance/thermal design.</text><text x="40" y="475" font-size="13">S3 EN -&gt;1k -&gt;EN14 with100k fail-low pulldown. Input UVLO: implement approved divider/inhibit circuit.</text><text x="40" y="505" font-size="13">FLT20 open drain -&gt;10k pullup3.3V -&gt;S3 input. Do not treat FLT as uniquely diagnosing a short.</text><text x="40" y="535" font-size="13">Select Cin/Cout/dVdT/UVLO/OVP from actual TI reference circuit and PV cold-voltage envelope.</text><text x="40" y="565" font-size="13">The 75k nominal ILIM is provisional; not a guarantee of 1.2A over all tolerances.</text><text x="40" y="595" font-size="13">Controller never replaces hardware limit. Fuse may not clear at PV-only Isc.</text><polyline class="net" points="700,310 700,325"/><polyline class="net" points="685,325 715,325"/><polyline class="net" points="690,331 710,331"/><polyline class="net" points="695,337 705,337"/><text x="30" y="705" font-size="11">Module boundaries are functional interfaces. Refer to POWER_DESIGN.md and manufacturer circuits for unresolved passives.</text></svg>