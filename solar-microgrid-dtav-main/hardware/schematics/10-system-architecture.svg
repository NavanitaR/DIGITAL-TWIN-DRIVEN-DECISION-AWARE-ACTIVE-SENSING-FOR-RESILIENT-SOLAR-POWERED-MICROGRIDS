<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#142932}.net{stroke:#177052;stroke-width:2;fill:none}.symbol{stroke:#182f39;stroke-width:2;fill:#fafcff}</style><text x="30" y="35" font-size="22">10 / Control and communications architecture</text><text x="30" y="60" font-size="12" style="fill:#a34731">PROVISIONAL ENGINEERING REVIEW / Not assembly approval / 2026-11-09</text><rect class="symbol" x="30" y="180" width="230" height="110"/><text x="40" y="205" font-size="14">S3 sensor node</text><text x="40" y="226" font-size="10">6 INA / DHT / LDR</text><rect class="symbol" x="315" y="180" width="230" height="110"/><text x="325" y="205" font-size="14">STM32F411</text><text x="325" y="226" font-size="10">7 INA / relays / TFT</text><rect class="symbol" x="600" y="180" width="230" height="110"/><text x="610" y="205" font-size="14">ESP32-C3</text><text x="610" y="226" font-size="10">UART to Wi-Fi bridge</text><rect class="symbol" x="885" y="180" width="230" height="110"/><text x="895" y="205" font-size="14">Laptop host</text><text x="895" y="226" font-size="10">MQTT / FastAPI / React</text><polyline class="net" points="260,235 315,235"/><text x="255" y="160" font-size="11">LoRa 433.92</text><polyline class="net" points="545,235 600,235"/><text x="540" y="160" font-size="11">UART COBS</text><polyline class="net" points="830,235 885,235"/><text x="825" y="160" font-size="11">MQTT binary</text><text x="40" y="370" font-size="13">Bidirectional commands: host -&gt; MQTT -&gt; C3 -&gt; UART -&gt; STM32 -&gt; LoRa -&gt; S3. ACKs follow reverse path.</text><text x="40" y="410" font-size="13">Protection boundaries: branch eFuse, hardware current limits, pack PCM, boost UVLO, DC fuses and emergency cutoff.</text><text x="30" y="515" font-size="11">Module boundaries are functional interfaces. Refer to POWER_DESIGN.md and manufacturer circuits for unresolved passives.</text></svg>