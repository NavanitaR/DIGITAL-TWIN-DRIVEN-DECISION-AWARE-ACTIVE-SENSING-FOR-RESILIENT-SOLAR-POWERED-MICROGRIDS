<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#142932}.net{stroke:#177052;stroke-width:2;fill:none}.symbol{stroke:#182f39;stroke-width:2;fill:#fafcff}</style><text x="30" y="35" font-size="22">06 / Relay driver channel, repeat KEN/KSEL/KPV/KL1-3</text><text x="30" y="60" font-size="12" style="fill:#a34731">PROVISIONAL ENGINEERING REVIEW / Not assembly approval / 2026-11-09</text><text x="40" y="180" font-size="14">MCU GPIO</text><polyline class="net" points="130,175 190,175"/><polyline class="net" points="190,175 205,175"/><rect class="symbol" x="205" y="167" width="55" height="16"/><polyline class="net" points="260,175 275,175"/><text x="201" y="155" font-size="11">100R gate</text><polyline class="net" points="275,175 420,175"/><rect class="symbol" x="420" y="140" width="180" height="100"/><text x="430" y="165" font-size="14">Logic N-MOSFET</text><text x="430" y="186" font-size="10">Rds_on at3.3V verified</text><text x="430" y="215" font-size="12">G / D / S interface</text><polyline class="net" points="500,140 500,95 820,95"/><rect class="symbol" x="820" y="75" width="200" height="65"/><text x="830" y="100" font-size="14">12V relay coil</text><text x="830" y="121" font-size="10">flyback diode in parallel</text><polyline class="net" points="1020,95 1100,95"/><text x="1040" y="75" font-size="12">COIL12</text><polyline class="net" points="500,240 500,300"/><polyline class="net" points="500,300 500,315"/><polyline class="net" points="485,315 515,315"/><polyline class="net" points="490,321 510,321"/><polyline class="net" points="495,327 505,327"/><polyline class="net" points="350,175 350,215"/><rect class="symbol" x="342" y="215" width="16" height="55"/><polyline class="net" points="350,270 350,290"/><text x="180" y="290" font-size="12">100k gate-source</text><polyline class="net" points="350,290 350,305"/><polyline class="net" points="335,305 365,305"/><polyline class="net" points="340,311 360,311"/><polyline class="net" points="345,317 355,317"/><text x="40" y="400" font-size="14">Flyback cathode to COIL12, anode to MOSFET drain; choose clamp for release timing and energy.</text><text x="40" y="435" font-size="14">Never connect a coil directly to MCU. External12V supply must support simultaneous coil current.</text><text x="40" y="470" font-size="14">Logic ground common with driver source; gate pulldown holds relays OFF through reset/brownout.</text><text x="30" y="595" font-size="11">Module boundaries are functional interfaces. Refer to POWER_DESIGN.md and manufacturer circuits for unresolved passives.</text></svg>