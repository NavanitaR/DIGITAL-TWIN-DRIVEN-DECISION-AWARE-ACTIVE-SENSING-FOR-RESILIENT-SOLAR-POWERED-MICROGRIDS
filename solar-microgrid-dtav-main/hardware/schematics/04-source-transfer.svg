<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#142932}.net{stroke:#177052;stroke-width:2;fill:none}.symbol{stroke:#182f39;stroke-width:2;fill:#fafcff}</style><text x="30" y="35" font-size="22">04 / Source transfer: master disconnect plus BBM selector</text><text x="30" y="60" font-size="12" style="fill:#a34731">PROVISIONAL ENGINEERING REVIEW / Not assembly approval / 2026-11-09</text><text x="40" y="150" font-size="14">SOLAR12</text><rect class="symbol" x="165" y="120" width="160" height="60"/><text x="175" y="145" font-size="14">Reverse blocking</text><text x="175" y="166" font-size="10">source fuse</text><polyline class="net" points="120,145 165,145"/><polyline class="net" points="325,145 440,145"/><circle cx="440" cy="145" r="4" fill="#177052"/><text x="450" y="135" font-size="12">NC solar</text><text x="40" y="300" font-size="14">BAT12</text><rect class="symbol" x="165" y="270" width="160" height="60"/><text x="175" y="295" font-size="14">Reverse blocking</text><text x="175" y="316" font-size="10">source fuse</text><polyline class="net" points="105,295 165,295"/><polyline class="net" points="325,295 440,295"/><circle cx="440" cy="295" r="4" fill="#177052"/><text x="450" y="320" font-size="12">NO battery</text><polyline class="net" points="440,145 535,220 620,220"/><text x="480" y="85" font-size="14">KSEL transfer PA9</text><circle cx="535" cy="220" r="4" fill="#177052"/><text x="550" y="200" font-size="11">COM</text><polyline class="net" points="620,220 670,220"/><polyline class="net" points="680,220 730,190"/><circle cx="745" cy="220" r="4" fill="#177052"/><polyline class="net" points="745,220 825,220"/><text x="650" y="160" font-size="14">KEN master PA8</text><rect class="symbol" x="825" y="190" width="170" height="60"/><text x="835" y="215" font-size="14">Main bus monitor</text><text x="835" y="236" font-size="10">INA226 0x41 / 10mR</text><polyline class="net" points="995,220 1150,220"/><text x="1050" y="200" font-size="15">BUS12</text><text x="40" y="400" font-size="14">PA8=0 PA9=0: bus OFF, selector solar. PA8=0 PA9=1: bus OFF, selector battery.</text><text x="40" y="435" font-size="14">PA8=1 PA9=0: solar ONLY. PA8=1 PA9=1: battery ONLY. Neither binary state parallels sources.</text><text x="40" y="480" font-size="14">Open KEN -&gt; change KSEL -&gt; wait&gt;=250ms -&gt; revalidate -&gt; close KEN -&gt; stage loads every2s.</text><text x="40" y="520" font-size="13">Verify BBM timing, DC motor/contact endurance, flyback release delay and failed-contact mitigation.</text><text x="40" y="555" font-size="13">Optional selector second-pole feedback is not wired. No physical actuation guarantee from coil drive alone.</text><text x="30" y="655" font-size="11">Module boundaries are functional interfaces. Refer to POWER_DESIGN.md and manufacturer circuits for unresolved passives.</text></svg>